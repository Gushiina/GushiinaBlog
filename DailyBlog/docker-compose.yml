services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dailyblog-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dailyblog-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailyblog-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./content:/app/content:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CONTENT_PATH=/app/content
    networks:
      - dailyblog-network

networks:
  dailyblog-network:
    driver: bridge
